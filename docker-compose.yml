services:
  nginx:
    image: nginx:1.17-alpine
    container_name: equip-nginx
    restart: unless-stopped
    ports:
      - 8080:80
    volumes:
      - ./back/src:/var/www/laravel_docker
      - ./back/nginx:/etc/nginx/conf.d
      - ./log:/var/log/nginx
    links:
      - php-fpm
    networks:
      - others_my-net

  php-fpm:
    container_name: equip-php-fpm
    user: "${UID:-1000}:${GID:-1000}"
    build:
      context: back/php
      args:
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
    restart: unless-stopped
    ports:
      - "9000:9000"
    working_dir: /var/www/laravel_docker
    volumes:
      - ./back/src:/var/www/laravel_docker
    networks:
      - others_my-net
      
  psg-equip:
    image: postgres:14.9-alpine
    volumes:
      - postgres-equip:/var/lib/postgresql/data
      - ./db:/home
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=postgres
      - LANG=C.UTF-8
    logging:
      options:
        max-file: "7"
        max-size: "5m"
    networks:
      - others_my-net

  nodejs_react:
    image: node:16.14.0-alpine
    container_name: nodejs_react
    volumes:
      - ./front_react:/usr/src/app
    working_dir: /usr/src/app
    ports:
      - 3006:3006
    tty: true
    stdin_open: true

  nodejs_vue:
    image: node:18.0.0-alpine
    container_name: nodejs_vue
    volumes:
      - ./front_vue:/usr/src/app
    working_dir: /usr/src/app
    ports:
      - 3000:3000
    tty: true
      
networks:
  others_my-net:
    driver: bridge
    
volumes:
  postgres-equip:


